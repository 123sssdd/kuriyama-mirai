name: "wajue_jianli_liangdian"
title: "挖掘简历亮点"
description: "把乌萨奇在工作和自建项目里遇到的有意思的点（排障、设计取舍、技术难点）挖成简历亮点：先核实事实，再判断价值，用手绘图和信息图 skills 做一份信息图集帮他建立故事线，然后起草六段式面试问答（如何发现、问题是什么、排障过程、解决方案、复盘、进一步优化），给出放进简历哪一部分的建议，最后写成一条 todo 放进滴答「简历亮点」清单。解决方案只留两三个最强亮点，其余好方法拆进进一步优化。用完本 skill 后，下一步固定是 grill-me 追问打磨，再用「栗山未来·逐字稿」整理成稿。"
category: "Work and knowledge"
include_in_prompt: false
